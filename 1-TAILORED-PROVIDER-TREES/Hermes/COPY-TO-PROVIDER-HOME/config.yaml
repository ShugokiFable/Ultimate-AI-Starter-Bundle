# Portable Hermes starter. MCP servers and completeness-gate hooks are wired
# by INSTALL-V7-AIO.ps1 from discovered local tools. This file must never
# contain a machine username, drive letter, or live MCP command.
#
# What ships here: aliases, free-model provider, agent/compression/display
# preferences, plugins. What does NOT: MCP servers of any kind. Until 7.9.8
# the npx-based ones were considered "portable enough" to ship, which is how a
# fresh install acquired five servers the bundle had already ruled out -- the
# rule three lines up was true as written and false in practice. See the
# mcp_servers note at the bottom.
model:
  default: deepseek/deepseek-v4-flash-0731
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  aliases:
    dots-3: openrouter/dots-studio/dots-3-note-preview:free
    nemotron-ultra: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    dots-3-nofree: openrouter/dots-studio/dots-3-note-preview
    nemotron-ultra-nofree: openrouter/nvidia/nemotron-3-ultra-550b-a55b
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  # Unlimited prevents large one-shot jobs from being amputated mid-task.
  max_turns: null
  verbose: false
  # V4 Flash 0731 exposes max/high/low reasoning through OpenRouter.
  # Max is intentional: a few extra reasoning tokens are cheaper than another
  # full 120K-context repair turn, and Hermes clamps unsupported levels safely.
  reasoning_effort: max
  # OpenRouter already retries across eligible backends. Keep Hermes' outer
  # retry loop bounded so a transient failure cannot rebill the full context
  # three extra times.
  api_max_retries: 2
  # DeepSeek is not covered by every historical "auto" tool-use heuristic.
  # Force the modern execution/closure guards on for dependable one-shot work.
  tool_use_enforcement: true
  execution_guidance: true
  intent_ack_continuation: true
  stall_guards: true
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  coding_context: auto
  verify_guidance: true
  max_verify_nudges: 3
  verify_on_stop: true
  empty_response_guard:
    enabled: true
    cost_threshold_usd: 0.01
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 600
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
  allow_private_urls: true
file_read_max_chars: 80000
tool_output:
  max_bytes: 30000
  max_lines: 1500
  max_line_length: 2000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: true
  # Fixed threshold_tokens is authoritative for the 1M default. Keep the
  # ratio at the upstream-safe default as a fallback for model switches.
  threshold: 0.50
  threshold_tokens: 120000
  target_ratio: 0.30
  tail_mode: lean
  protect_last_n: 20
  min_tail_user_messages: 3
  max_attempts: 4
  # Pruning rewrites the sent prefix and therefore breaks provider cache.
  # Wait until the context is substantial and only commit a large reclaim.
  proactive_prune_tokens: 80000
  proactive_prune_min_result_chars: 12000
  proactive_prune_min_reclaim_tokens: 32768
  micro_compact: false
  # Fail closed: never drop middle history just because the summarizer failed.
  abort_on_summary_failure: true
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  in_place: true
  # Let the absolute 120K size gate control DeepSeek compaction. Time-based
  # rewrites can destroy a still-warm OpenRouter prefix below that threshold.
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 1h
# OpenRouter full-response cache is separate from prefix/prompt caching. Keep
# it short so exact retries can be free without serving stale agent decisions.
mcp:
  # MCP surface changes invalidate the warm prompt/tool prefix. Apply them
  # deliberately via /reload-mcp instead of paying that cost on file writes.
  auto_reload_on_config_change: false
openrouter:
  response_cache: true
  response_cache_ttl: 300
  min_coding_score: 0.65
auxiliary:
  # One retry is enough for a transient side-call; more can rebill a huge
  # compression/web payload before the fallback chain gets a chance.
  transient_retries: 1
  # This curated bundle already owns skill quality and explicit memory nudges.
  # Avoid an extra full post-turn LLM fork and unreviewed automatic skill edits.
  background_review:
    enabled: false
  vision:
    provider: openrouter
    model: google/gemini-3.7-flash
  web_extract:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
  compression:
    # A bad compression summary costs far more in repair loops than this call.
    # Use the strong main model, but disable reasoning because summarization is
    # mechanical and thinking tokens add cost/latency without useful fidelity.
    provider: openrouter
    model: deepseek/deepseek-v4-flash-0731
    reasoning_effort: none
    timeout: 180
    extra_body:
      provider:
        sort: price
        require_parameters: true
  skills_hub:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
  approval:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
  mcp:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
  title_generation:
    enabled: false
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
  curator:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
display:
  compact: false
  personality: ''
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: true
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
  max_concurrent_children: 2
  max_spawn_depth: 1
moa:
  presets:
    default:
      reference_models:
        - provider: openrouter
          model: deepseek/deepseek-v4-flash-0731
          enabled: false
        - provider: openrouter
          model: google/gemini-3.7-flash
          enabled: false
      aggregator:
        model: deepseek/deepseek-v4-flash-0731
      enabled: false
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: openrouter
      model: deepseek/deepseek-v4-flash-0731
      enabled: false
    - provider: openrouter
      model: google/gemini-3.7-flash
      enabled: false
  aggregator:
    provider: openrouter
    model: deepseek/deepseek-v4-flash-0731
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  enabled: false
skills:
  # The bundle already ships a curated cross-provider skill library. Automatic
  # skill-creation nudges add prompt churn every N tool iterations and can grow
  # unreviewed local skill drift; manual skill creation remains available.
  creation_nudge_interval: 0
security:
  allow_private_urls: true
kanban:
  review_dispatch: true
code_execution:
  timeout: 600
  max_tool_calls: 100
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 37
provider_routing:
  sort: price
  require_parameters: true
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
# MCP is NOT owned by this file. INSTALL-V7-AIO.ps1 wires the always-on core
# and TOOLS\Set-McpProfile.ps1 wires capability profiles, both from what is
# actually installed on this machine and in the scope each server belongs in.
#
# A live block here duplicated that ownership: because the installer copies
# this file whole onto a machine that has no config.yaml, every entry became a
# fresh-install default that outranked the bundle's own decisions. It shipped
# sequential-thinking after 7.9.7 measured it out of the always-on core, a
# GitHub package upstream had withdrawn, an unpinned @latest server, and
# firecrawl-mcp -- 25 tool schemas, ~9,080 tokens on every turn, for search
# and scrape that Hermes already does natively and keylessly.
#
# Keep this empty. To add a server, use the installer or `hermes mcp add`;
# then it is yours, and no bundle upgrade will assume it was.
mcp_servers: {}
plugins:
  enabled:
    - disk-cleanup
    - ponytail
    - superpowers/.hermes-plugin
  disabled:
    - web/brave_free
  entries:
    ponytail:
      allow_tool_override: false
