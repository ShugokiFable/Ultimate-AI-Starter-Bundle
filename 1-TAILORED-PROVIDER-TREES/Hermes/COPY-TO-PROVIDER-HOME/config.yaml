# Portable Hermes starter config. Ships provider/model preferences only;
# MCP servers and hooks are wired per-machine by INSTALL-AIO.ps1.
model:
  default: stealth/ox-alpha
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  aliases:
    # Escalation ladder. Every id verified against openrouter.ai/api/v1/models;
    # none is written from memory. Switch with `hermes model <alias>`.
    flash: openrouter/deepseek/deepseek-v4-flash-0731
    flash-vision: openrouter/deepseek/deepseek-v4-flash-vision-exp
    muse: openrouter/meta/muse-spark-1.2-contributor
    v4-pro: openrouter/deepseek/deepseek-v4-pro-0813
    ox: openrouter/stealth/ox-alpha
    gemini-flash: openrouter/google/gemini-3.7-flash
    glm: openrouter/z-ai/glm-5.3
    grok: openrouter/x-ai/grok-4.6
    sol: openrouter/openai/gpt-5.6-sol
    opus: openrouter/anthropic/claude-opus-5
# Automatic failover when the primary is unavailable (429 rate limit, 529
# overload, 503, or a connection failure). All four are :free variants, so a
# failover costs nothing.
#
# Ordered best-first. Note that laguna-s is TEXT-ONLY: if a vision task fails
# over to it, images are dropped. inkling (second) accepts text, image, and
# audio, which is why it sits directly behind.
fallback_providers:
  - provider: openrouter
    model: poolside/laguna-s-2.1:free
  - provider: openrouter
    model: thinkingmachines/inkling:free
  - provider: openrouter
    model: thinkingmachines/inkling-small:free
  - provider: openrouter
    model: poolside/laguna-xs-2.1:free
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  # Unlimited turns: large one-shot jobs must never be amputated mid-task.
  max_turns: null
  api_max_retries: 2
  empty_response_guard:
    enabled: true
    cost_threshold_usd: 0.01
  tool_use_enforcement: true
  execution_guidance: true
  intent_ack_continuation: true
  stall_guards: true
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  coding_context: auto
  verify_guidance: true
  max_verify_nudges: 3
  verify_on_stop: true
  verbose: false
  reasoning_effort: max
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 600
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
  allow_private_urls: true
file_read_max_chars: 80000
mcp:
  auto_reload_on_config_change: false
tool_output:
  max_bytes: 30000
  max_lines: 1500
  max_line_length: 2000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: true
  threshold: 0.50
  threshold_tokens: 160000
  target_ratio: 0.25
  tail_mode: lean
  protect_last_n: 20
  min_tail_user_messages: 3
  max_attempts: 4
  proactive_prune_tokens: 80000
  proactive_prune_min_result_chars: 12000
  proactive_prune_min_reclaim_tokens: 32768
  micro_compact: false
  protect_first_n: 3
  abort_on_summary_failure: true
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  in_place: true
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 1h
openrouter:
  response_cache: true
  response_cache_ttl: 300
  min_coding_score: 0.65
auxiliary:
  transient_retries: 1
  vision:
    # Must be multimodal. laguna-s is text-only and would silently drop images.
    provider: openrouter
    model: thinkingmachines/inkling:free
  web_extract:
    provider: openrouter
    model: poolside/laguna-s-2.1:free
  compression:
    provider: openrouter
    # NOT a free model on purpose: compression ingests up to the 160000-token
    # threshold, and laguna-s tops out at 262K context. Flash-0731 has 1.3M and
    # costs ~$0.006 per compression -- cheaper than one truncated summary.
    model: deepseek/deepseek-v4-flash-0731
    timeout: 180
    extra_body:
      provider:
        sort: price
        require_parameters: true
    reasoning_effort: none
  skills_hub:
    provider: openrouter
    model: poolside/laguna-s-2.1:free
  approval:
    provider: openrouter
    model: poolside/laguna-s-2.1:free
  mcp:
    provider: openrouter
    model: poolside/laguna-s-2.1:free
  title_generation:
    enabled: false
    provider: openrouter
    model: poolside/laguna-s-2.1:free
  curator:
    provider: openrouter
    model: poolside/laguna-s-2.1:free
  background_review:
    enabled: false
display:
  compact: false
  personality: ''
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: true
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
  max_concurrent_children: 2
  max_spawn_depth: 1
moa:
  presets:
    default:
      reference_models:
        - provider: openrouter
          model: deepseek/deepseek-v4-flash-0731
          enabled: false
        - provider: openrouter
          model: google/gemini-3.7-flash
          enabled: false
      aggregator:
        model: deepseek/deepseek-v4-flash-0731
      enabled: false
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: openrouter
      model: deepseek/deepseek-v4-flash-0731
      enabled: false
    - provider: openrouter
      model: google/gemini-3.7-flash
      enabled: false
  aggregator:
    provider: openrouter
    model: deepseek/deepseek-v4-flash-0731
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  enabled: false
skills:
  creation_nudge_interval: 0
security:
  allow_private_urls: true
kanban:
  review_dispatch: true
code_execution:
  timeout: 600
  max_tool_calls: 100
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 37
provider_routing:
  sort: price
  require_parameters: true
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
mcp_servers: {}
plugins:
  enabled:
    - disk-cleanup
    - ponytail
    - superpowers/.hermes-plugin
  disabled:
    - web/brave_free
  entries:
    ponytail:
      allow_tool_override: false

# -- Security ----------------------------------------------------------
# Secret redaction is ON by default -- strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# -- Fallback Model ----------------------------------------------------
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  -- routes to any model
#   openai-codex (OAuth -- hermes auth) -- OpenAI Codex
#   nous         (OAuth -- hermes auth) -- Nous Portal
#   zai          (ZAI_API_KEY)         -- Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        -- Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   -- Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     -- MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  -- MiniMax (China)
#   bedrock      (AWS IAM / boto3)     -- AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
