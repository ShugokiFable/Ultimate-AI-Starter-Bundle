# Portable Hermes starter. MCP servers and completeness-gate hooks are wired
# by INSTALL-V7-AIO.ps1 from discovered local tools. This file must never
# contain a machine username, drive letter, or live MCP command.
#
# Reference-machine live config (ShugokiFable) reconciled into this portable
# form: aliases, free-model provider, plugins, and the npx-based MCP servers
# are portable and ship here. Path-based MCP servers (housecarl, forge,
# codebase-memory, headroom) stay OUT of this file -- INSTALL-V7-AIO.ps1
# discovers and wires them from the local machine.
model:
  default: deepseek/deepseek-v4-flash-0731
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  aliases:
    dots-3: openrouter/dots-studio/dots-3-note-preview:free
    nemotron-ultra: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    dots-3-nofree: openrouter/dots-studio/dots-3-note-preview
    nemotron-ultra-nofree: openrouter/nvidia/nemotron-3-ultra-550b-a55b
providers:
  openrouter-extra:
    name: OpenRouter Extras
    api: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    transport: chat_completions
    discover_models: false
    default_model: dots-studio/dots-3-note-preview:free
    models:
      dots-studio/dots-3-note-preview:free: dots-3 free
      dots-studio/dots-3-note-preview: dots-3
      nvidia/nemotron-3-ultra-550b-a55b:free: nemotron ultra free
      nvidia/nemotron-3-ultra-550b-a55b: nemotron ultra
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 350
  verbose: false
  reasoning_effort: high
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
  allow_private_urls: true
file_read_max_chars: 80000
tool_output:
  max_bytes: 30000
  max_lines: 1500
  max_line_length: 2000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: true
  threshold: 0.14
  threshold_tokens: 140000
  target_ratio: 0.11
  tail_mode: lean
  protect_last_n: 6
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 48000
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  in_place: true
  idle_compact_after_seconds: 1800
prompt_caching:
  cache_ttl: 5m
auxiliary:
  vision:
    provider: openrouter
    model: google/gemini-3.7-flash
  web_extract:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
  compression:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
  skills_hub:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
  approval:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
  mcp:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
  title_generation:
    enabled: false
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
  curator:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
display:
  compact: false
  personality: ''
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: true
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
  max_concurrent_children: 2
  max_spawn_depth: 1
moa:
  presets:
    default:
      reference_models:
        - provider: openrouter
          model: deepseek/deepseek-v4-flash-0731
          enabled: false
        - provider: openrouter
          model: google/gemini-3.7-flash
          enabled: false
      aggregator:
        model: deepseek/deepseek-v4-flash-0731
      enabled: false
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: openrouter
      model: deepseek/deepseek-v4-flash-0731
      enabled: false
    - provider: openrouter
      model: google/gemini-3.7-flash
      enabled: false
  aggregator:
    provider: openrouter
    model: deepseek/deepseek-v4-flash-0731
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  enabled: false
skills:
  creation_nudge_interval: 15
security:
  allow_private_urls: true
kanban:
  review_dispatch: true
code_execution:
  timeout: 300
  max_tool_calls: 50
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 37
provider_routing:
  sort: price
  require_parameters: true
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
# Portable MCP servers (npx-based, no local paths). housecarl / skyrim-forge /
# codebase-memory-mcp / headroom are wired by INSTALL-V7-AIO.ps1 from
# discovered tools and must NOT be hardcoded here.
mcp_servers:
  context7:
    command: npx
    args:
      - -y
      - '@upstash/context7-mcp@4.0.2'
    enabled: true
  sequential-thinking:
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-sequential-thinking@2026.7.4'
    enabled: true
  github:
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-github@2025.4.8'
    enabled: true
  playwright:
    command: npx
    args:
      - -y
      - '@playwright/mcp@latest'
    enabled: true
  firecrawl:
    command: npx
    args:
      - -y
      - firecrawl-mcp@3.24.0
    enabled: true
plugins:
  enabled:
    - disk-cleanup
    - ponytail
    - superpowers/.hermes-plugin
  disabled:
    - web/brave_free
  entries:
    ponytail:
      allow_tool_override: false
