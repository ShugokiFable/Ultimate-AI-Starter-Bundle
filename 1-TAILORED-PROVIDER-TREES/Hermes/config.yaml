# Portable Hermes starter. MCP servers and completeness-gate hooks are wired
# by INSTALL-V7-AIO.ps1 from discovered local tools. This file must never
# contain a machine username, drive letter, or live MCP command.
model:
  default: deepseek/deepseek-v4-flash-0731
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
providers:
  openrouter-extra:
    name: OpenRouter Extras
    api: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    transport: chat_completions
    discover_models: false
agent:
  max_turns: 350
  verbose: false
  reasoning_effort: high
terminal:
  backend: local
  cwd: .
  timeout: 180
file_read_max_chars: 80000
tool_output:
  max_bytes: 30000
  max_lines: 1500
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: true
  threshold: 0.14
  threshold_tokens: 140000
  target_ratio: 0.11
  tail_mode: lean
  protect_last_n: 6
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 48000
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  in_place: true
  idle_compact_after_seconds: 1800
auxiliary:
  vision:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
  compression:
    provider: openrouter
    model: dots-studio/dots-3-note-preview:free
display:
  compact: false
  show_reasoning: true
  streaming: true
memory:
  memory_enabled: true
  user_profile_enabled: true
delegation:
  max_iterations: 50
  max_concurrent_children: 2
  max_spawn_depth: 1
security:
  allow_private_urls: true
provider_routing:
  sort: price
  require_parameters: true
mcp_servers: {}
